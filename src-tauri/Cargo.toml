[package]
name = "focuspulse"
version = "1.0.0"
description = "FocusPulse — Study, Tasks, Habits & Hydration Application by Foc-It"
authors = ["azmee7 (Azmi)"]
license = "Custom"
edition = "2021"

[lib]
name = "focuspulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
